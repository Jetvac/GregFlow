<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GregFlow — планировщик линий GTNH</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="toolbar">
  <div class="brand" title="GTNH"><span class="logo">⚙</span>GregFlow</div>
  <div class="tbgroup">
    <div class="menu">
      <button data-menu title="Файл схемы: создать, открыть, сохранить, импорт и экспорт">Файл <span class="caret">▾</span></button>
      <div class="mpop">
        <button data-tb="new"><i>＋</i><span>Новая схема</span></button>
        <button data-tb="open"><i>📂</i><span>Открыть…</span><kbd>Ctrl+O</kbd></button>
        <button data-tb="save"><i>💾</i><span>Сохранить</span><kbd>Ctrl+S</kbd></button>
        <hr>
        <button data-tb="import"><i>⭱</i><span>Импорт файла…</span></button>
        <button data-tb="export"><i>⭳</i><span>Экспорт файла</span></button>
        <button data-tb="png"><i>🖼</i><span>Картинка PNG</span></button>
        <hr>
        <button data-tb="demo"><i>🧪</i><span>Демо-схема</span></button>
      </div>
    </div>
    <div class="menu">
      <button data-menu title="Добавить узел на схему">Добавить <span class="caret">▾</span></button>
      <div class="mpop">
        <button data-tb="splitter"><i>⑂</i><span>Разветвитель</span></button>
        <button data-tb="merger"><i>⋈</i><span>Слияние</span></button>
        <button data-tb="sink"><i>▣</i><span>Склад</span></button>
        <button data-tb="generator"><i>⚡</i><span>Генератор</span></button>
        <hr class="blkonly">
        <button data-tb="gin" class="blkonly"><i>⇥</i><span>Вход блока</span></button>
        <button data-tb="gout" class="blkonly"><i>⇤</i><span>Выход блока</span></button>
        <div class="mnote">Рецепт: перетащите из каталога слева или тяните связь от порта в пустое место</div>
      </div>
    </div>
    <div class="menu">
      <button data-menu title="Язык, названия, единицы скорости">Вид <span class="caret">▾</span></button>
      <div class="mpop mform">
        <label>Язык интерфейса <select id="uilang"><option value="ru">Русский</option><option value="en">English</option></select></label>
        <label>Названия предметов и машин <select id="lang"><option value="ru">русские</option><option value="en">английские</option></select></label>
        <label>Единицы скорости <select id="unit"><option value="t">за тик</option><option value="s">в секунду</option><option value="min">в минуту</option><option value="h">в час</option></select></label>
        <label title="Длинные связи можно показывать короткими метками у обоих концов: у входа — откуда идёт, у выхода — сколько связей. Наведите на метку — видна линия; при выборе узла его связи рисуются полностью. Для отдельной связи это меняется в её свойствах.">Связи метками <select id="edgetags"><option value="none">не использовать</option><option value="fuel">топливо генераторов</option><option value="sources">топливо и всё от источников</option></select></label>
        <label class="mchk" title="Маленькие номера у слотов машин GT: какой номер слота выставить на роборуке"><input type="checkbox" id="armslots"> <span>Номера слотов для роборук</span></label>
      </div>
    </div>
  </div>
  <div class="tbgroup icons">
    <button id="undo" data-tb="undo" title="Отменить (Ctrl+Z)">↶</button>
    <button id="redo" data-tb="redo" title="Повторить (Ctrl+Y)">↷</button>
    <button data-tb="fit" title="Вписать схему (F)">⤢</button>
    <button data-tb="arrange" title="Расставить узлы по потоку слева направо (L); при выделении — только выделенные">⇶</button>
  </div>
  <div class="tbgroup">
    <button data-tb="group" title="Объединить выделенные узлы в блок (Ctrl+G). Выделение: Ctrl/Shift + щелчок или Shift + рамка">▦ В блок</button>
    <label class="tbchk" title="Учитывать энергию: генераторы, кабели, потери. Выключено — схема считается без энергии"><input type="checkbox" id="energyOn"> ⚡ Энергия</label>
    <button data-tb="machines" title="Отчёт по схеме: машины, генераторы, кабели и баланс ресурсов">☰ Отчёт</button>
  </div>
  <button id="probs" class="badge warn" data-tb="probs" hidden></button>
  <div id="badges"></div>
  <button class="tbset" data-tb="setup" title="Данные рецептов, язык, папка Minecraft">⚙ Настройка</button>
</header>
<main>
  <aside id="catalog" class="panel"></aside>
  <section id="canvaswrap"><div id="canvas"></div><div id="ptitle"></div></section>
  <aside id="props" class="panel"></aside>
</main>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
