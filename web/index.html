<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GregFlow — планировщик линий GTNH</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="toolbar">
  <div class="brand" title="GTNH">GregFlow</div>
  <div class="tbgroup">
    <button data-tb="new" title="Новая схема">Новая</button>
    <button data-tb="open" title="Открыть из папки projects/">Открыть</button>
    <button data-tb="save" title="Сохранить в projects/ (Ctrl+S)">Сохранить</button>
    <button data-tb="export" title="Скачать файл схемы">Экспорт</button>
    <button data-tb="import" title="Загрузить файл схемы">Импорт</button>
    <button data-tb="png" title="Сохранить картинку схемы (PNG)">PNG</button>
    <button data-tb="demo" title="Пример с условными значениями источников">Демо</button>
  </div>
  <div class="tbgroup">
    <button id="undo" data-tb="undo" title="Отменить (Ctrl+Z)">↶</button>
    <button id="redo" data-tb="redo" title="Повторить (Ctrl+Y)">↷</button>
    <button data-tb="fit" title="Вписать схему (F)">⤢</button>
    <button data-tb="arrange" title="Расставить узлы по потоку слева направо (L); при выделении — только выделенные">⇶</button>
  </div>
  <div class="tbgroup">
    <button data-tb="splitter" title="Добавить разветвитель">+ Разветвитель</button>
    <button data-tb="merger" title="Добавить слияние">+ Слияние</button>
    <button data-tb="sink" title="Добавить склад">+ Склад</button>
    <button data-tb="generator" title="Добавить генератор (включает учёт энергии)">+ Генератор</button>
  </div>
  <div class="tbgroup">
    <button data-tb="group" title="Объединить выделенные узлы в блок (Ctrl+G). Выделение: Ctrl/Shift + щелчок или Shift + рамка">▦ В блок</button>
    <button data-tb="gin" class="blkonly" title="Добавить вход блока">+ Вход блока</button>
    <button data-tb="gout" class="blkonly" title="Добавить выход блока">+ Выход блока</button>
  </div>
  <div class="tbgroup">
    <label class="tbchk" title="Учитывать энергию: генераторы, кабели, потери. Выключено — схема считается без энергии"><input type="checkbox" id="energyOn"> ⚡ Энергия</label>
    <button data-tb="machines" title="Сводный список всех машин, генераторов и кабелей схемы">☰ Список машин</button>
  </div>
  <div class="tbgroup"><label title="Язык интерфейса"><span class="tbl">Интерфейс</span> <select id="uilang"><option value="ru">Русский</option><option value="en">English</option></select></label></div>
  <div class="tbgroup"><label title="Язык названий предметов и машин"><span class="tbl">Названия</span> <select id="lang"><option value="ru">русские</option><option value="en">английские</option></select></label></div>
  <div class="tbgroup"><label title="Единицы скорости"><span class="tbl">Единицы</span> <select id="unit"><option value="t">за тик</option><option value="s">в секунду</option><option value="min">в минуту</option><option value="h">в час</option></select></label></div>
  <div class="tbgroup"><button data-tb="setup" title="Данные рецептов, язык, папка Minecraft">⚙ Настройка</button></div>
  <button id="probs" class="badge warn" data-tb="probs" hidden></button>
  <div id="badges"></div>
</header>
<main>
  <aside id="catalog" class="panel"></aside>
  <section id="canvaswrap"><div id="canvas"></div><div id="ptitle"></div></section>
  <aside id="props" class="panel"></aside>
</main>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
